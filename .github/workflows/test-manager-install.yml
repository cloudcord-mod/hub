name: Test published Manager installation
on:
  workflow_dispatch:
    inputs:
      test_patched_discord:
        description: Check for delayed exits in the patched Discord 354.12 Android 15 build
        type: boolean
        default: false
      patched_run_id:
        description: Build run containing the patched Discord APKs
        default: '44135168195'
      fresh_install_attempts:
        description: Independent fresh installations to test (1 through 5)
        type: number
        default: 3
permissions:
  contents: read
  actions: read
jobs:
  install:
    if: ${{ !inputs.test_patched_discord }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CloudCordManager-test
          run-id: 42087479720
          github-token: ${{ github.token }}
          path: preview
      - name: Verify exact published APK
        run: |
          set -euo pipefail
          apk="$(find preview -name '*.apk' -type f)"
          cp "$apk" manager.apk
          echo '9f79917f635377be32096576b4490298d7c292ccefda8159fd4199afb29231bf  manager.apk' | sha256sum --check
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$signer" verify --verbose --print-certs manager.apk
          "$(dirname "$signer")/zipalign" -c -P 16 -v 4 manager.apk > alignment.txt 2>&1 || true
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, reinstall, and launch the published Manager
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell getprop ro.build.version.release | tee android-version.txt
            adb install --no-streaming manager.apk 2>&1 | tee install.txt
            grep -q '^Success' install.txt
            adb install --no-streaming -r manager.apk 2>&1 | tee reinstall.txt
            grep -q '^Success' reinstall.txt
            adb shell am start -W -n com.getcloudcord.manager/com.aliucord.manager.MainActivity | tee launch.txt
            sleep 10
            adb logcat -d > logcat.txt
            adb exec-out screencap -p > manager.png
            adb shell pidof com.getcloudcord.manager | tee process.txt
            test -s process.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Manager-install-android-${{ matrix.api }}
          path: |
            *.txt
            manager.png
  patched-discord:
    if: ${{ inputs.test_patched_discord }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate patched build and attempts
        uses: actions/github-script@v7
        env:
          PATCHED_RUN_ID: ${{ inputs.patched_run_id }}
          FRESH_INSTALL_ATTEMPTS: ${{ inputs.fresh_install_attempts }}
        with:
          script: |
            if (!/^\d+$/.test(process.env.PATCHED_RUN_ID)) throw Error('Invalid patched build run');
            if (!/^[1-5]$/.test(process.env.FRESH_INSTALL_ATTEMPTS)) throw Error('Choose 1 through 5 fresh installs');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(process.env.PATCHED_RUN_ID)});
            if (run.conclusion !== 'success') throw Error('The patched build must have succeeded');
            core.info(`Testing patched APKs from ${run.html_url} at ${run.head_sha}`);
      - uses: actions/download-artifact@v4
        with:
          name: CloudCordManager-patched-apks
          run-id: ${{ inputs.patched_run_id }}
          github-token: ${{ github.token }}
          path: patched
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check patched Discord for delayed exits
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FRESH_INSTALL_ATTEMPTS: ${{ inputs.fresh_install_attempts }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          heap-size: 1024M
          disable-animations: true
          script: bash android/scripts/test-patched-discord-launch.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Patched-Discord-Android-15-launch
          path: |
            *.txt
            discord.png
