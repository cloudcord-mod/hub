name: Test published Manager installation
on:
  workflow_dispatch:
    inputs:
      test_patched_discord:
        description: Check for delayed exits in the patched Discord 354.12 Android 15 build
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  install:
    if: ${{ !inputs.test_patched_discord }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CloudCordManager-test
          run-id: 42087479720
          github-token: ${{ github.token }}
          path: preview
      - name: Verify exact published APK
        run: |
          set -euo pipefail
          apk="$(find preview -name '*.apk' -type f)"
          cp "$apk" manager.apk
          echo '9f79917f635377be32096576b4490298d7c292ccefda8159fd4199afb29231bf  manager.apk' | sha256sum --check
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$signer" verify --verbose --print-certs manager.apk
          "$(dirname "$signer")/zipalign" -c -P 16 -v 4 manager.apk > alignment.txt 2>&1 || true
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, reinstall, and launch the published Manager
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell getprop ro.build.version.release | tee android-version.txt
            adb install --no-streaming manager.apk 2>&1 | tee install.txt
            grep -q '^Success' install.txt
            adb install --no-streaming -r manager.apk 2>&1 | tee reinstall.txt
            grep -q '^Success' reinstall.txt
            adb shell am start -W -n com.getcloudcord.manager/com.aliucord.manager.MainActivity | tee launch.txt
            sleep 10
            adb logcat -d > logcat.txt
            adb exec-out screencap -p > manager.png
            adb shell pidof com.getcloudcord.manager | tee process.txt
            test -s process.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Manager-install-android-${{ matrix.api }}
          path: |
            *.txt
            manager.png
  patched-discord:
    if: ${{ inputs.test_patched_discord }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CloudCordManager-patched-apks
          run-id: 44135168195
          github-token: ${{ github.token }}
          path: patched
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check patched Discord for delayed exits
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          heap-size: 1024M
          disable-animations: true
          script: |
            set -euo pipefail
            signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
            "$(dirname "$signer")/aapt" dump badging patched/patched-base.apk > patched-package.txt
            package="$(sed -n "s/^package: name='\(com\.getcloudcord\.[^']*\)' versionCode='354012'.*/\1/p" patched-package.txt)"
            test -n "$package"
            trap 'adb logcat -b crash -d > crash-buffer.txt; adb shell dumpsys activity exit-info "$package" > exit-info.txt; adb logcat -d > launch-logcat.txt; adb exec-out screencap -p > discord.png' EXIT
            adb install-multiple --no-streaming patched/*.apk | tee install.txt
            grep -qx Success install.txt
            adb shell am start -W -n "$package/com.discord.main.MainDefault" | tee launch.txt
            grep -qx 'Status: ok' launch.txt
            first_pid="$(adb shell pidof "$package" | tr -d '\r')"
            test -n "$first_pid"
            for iteration in $(seq 1 14); do
              sleep 5
              process_id="$(adb shell pidof "$package" | tr -d '\r' || true)"
              printf '%ss %s\n' "$((iteration * 5))" "$process_id" | tee -a process.txt
              if [[ "$process_id" != "$first_pid" ]]; then
                echo 'CloudCord exited or restarted during the 70-second observation' >&2
                exit 1
              fi
            done
            adb logcat -d --pid="$first_pid" > client-logcat.txt
            grep -q 'CloudCord is ready!' client-logcat.txt
            if grep -Eq 'FATAL EXCEPTION|Failed to load CloudCord' client-logcat.txt; then
              echo 'CloudCord reported a startup failure' >&2
              exit 1
            fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Patched-Discord-Android-15-launch
          path: |
            *.txt
            discord.png
